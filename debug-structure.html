<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>应县木塔 · 结构调试页</title>
    <style>
      :root {
        --bg: #eee5d3;
        --panel: rgba(28, 24, 20, 0.7);
        --panel-border: rgba(255,255,255,0.18);
        --text: #f8f4ef;
        --muted: rgba(248, 244, 239, 0.72);
        --accent: #d9b66c;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg);
      }

      #app {
        position: fixed;
        inset: 0;
        background: linear-gradient(180deg, #f5efe5 0%, #eee4d2 100%);
      }

      .toolbar {
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        padding: 12px 14px;
        border: 1px solid var(--panel-border);
        border-radius: 12px;
        background: var(--panel);
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 24px rgba(0,0,0,0.14);
      }

      .toolbar label {
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      select, button, input[type="range"] {
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 10px;
        background: rgba(255,255,255,0.06);
        color: var(--text);
        padding: 9px 12px;
        font-size: 13px;
      }

      button {
        cursor: pointer;
        transition: transform 0.15s ease, background 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
        background: rgba(255,255,255,0.1);
      }

      .timeline {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 220px;
      }

      input[type="range"] {
        flex: 1;
        padding: 0;
        accent-color: #d9b66c;
      }

      .status {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 11;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.16);
        background: rgba(36, 31, 27, 0.7);
        color: var(--text);
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div class="toolbar">
      <button id="toggleBuild" type="button">暂停</button>
      <button id="resetBuild" type="button">重置</button>
      <button id="overviewView" type="button">总览</button>
      <button id="interiorView" type="button">室内升升</button>
      <label for="levelSelect">层级</label>
      <select id="levelSelect" aria-label="Choose storey">
        <option value="all">全部</option>
      </select>
      <div class="timeline">
        <label for="progressSlider">搭建</label>
        <input id="progressSlider" type="range" min="0" max="100" value="0" />
      </div>
    </div>

    <div id="status" class="status">地基</div>

    <script type="module" src="./src/debugStructure.js"></script>
  </body>
</html>
